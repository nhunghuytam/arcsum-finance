<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance - DEX on Arc Testnet</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; }
    .tab-active { border-bottom: 3px solid rgb(16 185 129); color: white; font-weight: 600; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <nav class="fixed top-0 w-full bg-black/90 backdrop-blur-md border-b border-zinc-800 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">ArcSum</h1>
        <span class="text-xs px-3 py-1 bg-emerald-500/10 text-emerald-400 rounded-full">.finance</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="addArcNetwork()" class="px-5 py-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm transition">
          Add Arc Network
        </button>
        <button onclick="connectWallet()" id="connectBtn"
                class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 rounded-2xl font-semibold transition">
          Connect Wallet
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-4xl mx-auto pt-28 px-4 pb-12">
    <div class="flex border-b border-zinc-800 mb-8 overflow-x-auto">
      <button onclick="switchTab(0)" class="tab px-8 py-4 tab-active" id="tab0">Faucet + Streak</button>
      <button onclick="switchTab(1)" class="tab px-8 py-4 text-zinc-400 hover:text-white" id="tab1">Swap</button>
      <button onclick="switchTab(2)" class="tab px-8 py-4 text-zinc-400 hover:text-white" id="tab2">Add Liquidity</button>
      <button onclick="switchTab(3)" class="tab px-8 py-4 text-zinc-400 hover:text-white" id="tab3">Mint NFT</button>
    </div>

    <!-- Các tab giữ nguyên như cũ -->
    <div id="content0" class="tab-content"> ... (giữ nguyên như bản trước) </div>
    <div id="content1" class="tab-content hidden"> ... </div>
    <!-- Các tab khác tương tự -->
  </div>

<script>
let provider, signer, userAddress;

// ================== CONFIG ==================
const CHAIN_ID = "0x4cef52";        // 5042002
const RPC_URL = "https://rpc.testnet.arc.network";
const EXPLORER_URL = "https://testnet.arcscan.app";

// ================== ADD NETWORK ==================
async function addArcNetwork() {
  try {
    await window.ethereum.request({
      method: 'wallet_addEthereumChain',
      params: [{
        chainId: CHAIN_ID,
        chainName: 'Arc Testnet',
        nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 },
        rpcUrls: [RPC_URL],
        blockExplorerUrls: [EXPLORER_URL]
      }]
    });
    alert("✅ Đã thêm Arc Testnet thành công!\nHãy nhấn Connect Wallet lần nữa.");
  } catch (e) {
    alert("Lỗi thêm network: " + (e.message || e));
  }
}

// ================== CONNECT WALLET (ĐÃ SỬA) ==================
async function connectWallet() {
  if (!window.ethereum) {
    return alert("❌ Vui lòng cài MetaMask hoặc Rabby Wallet!");
  }

  try {
    // Thử switch network
    await window.ethereum.request({
      method: 'wallet_switchEthereumChain',
      params: [{ chainId: CHAIN_ID }]
    });

    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    document.getElementById("connectBtn").innerHTML = 
      `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
    
    alert("✅ Kết nối ví Arc Testnet thành công!");
    
  } catch (error) {
    console.error(error);
    
    if (error.code === 4902) {
      alert("⚠️ Chưa có mạng Arc Testnet. Đang thêm tự động...");
      await addArcNetwork();
    } 
    else if (error.code === 4001) {
      alert("Bạn đã từ chối kết nối ví.");
    }
    else {
      alert("Lỗi kết nối: " + (error.message || error));
    }
  }
}

// ================== Các hàm khác (Faucet, Swap, Mint) ==================
async function claimFaucet() {
  if (!userAddress) return alert("Vui lòng Connect Wallet trước!");
  window.open("https://faucet.circle.com/", "_blank");
}

async function executeSwap() {
  if (!userAddress) return alert("Vui lòng Connect Wallet trước!");
  const amount = document.getElementById("fromAmount").value || 10;
  alert(`🔄 Đang thực hiện swap ${amount} USDC...\n\n(Đang simulate - chức năng đầy đủ sau)`);
}

async function mintNFT() {
  if (!userAddress) return alert("Vui lòng Connect Wallet trước!");
  alert("🎟️ Đang mint NFT...\n\n(Đang simulate)");
}

function switchTab(n) {
  document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('tab-active', i===n));
  document.querySelectorAll('.tab-content').forEach((c,i) => c.classList.toggle('hidden', i!==n));
}

// Khởi tạo
switchTab(0);
console.log("✅ ArcSum Finance v2 loaded");
</script>
</body>
</html>
