<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance - DEX on Arc</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <!-- Ethers.js - Dùng jsDelivr (ổn định hơn) -->
  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.min.js"></script>

  <script>
    tailwind.config = { content: [], theme: { extend: {} } }
  </script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-zinc-900/95 backdrop-blur-md border-b border-zinc-700 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">ArcSum</h1>
        <span class="text-xs px-2 py-1 bg-emerald-500/10 text-emerald-400 rounded-full">.finance</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="addArcNetwork()" 
                class="bg-zinc-800 hover:bg-zinc-700 px-5 py-2.5 rounded-2xl text-sm transition">
          Add Arc Network
        </button>
        <button onclick="connectWallet()" id="connectBtn" 
                class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2.5 rounded-2xl font-semibold transition">
          Connect Wallet
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div class="max-w-7xl mx-auto px-6 pt-28 pb-20 text-center">
    <h2 class="text-5xl font-bold mb-4">ArcSum Finance</h2>
    <p class="text-xl text-zinc-400">Liquidity Hub trên Arc L1</p>
  </div>

  <!-- Connect Button -->
  <div class="max-w-md mx-auto bg-zinc-900 rounded-3xl p-8 mt-10">
    <button onclick="connectWallet()" 
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-4 rounded-2xl text-lg transition">
      Connect Wallet
    </button>
  </div>

<script>
// === CẤU HÌNH ===
const ARC_CHAIN_ID = '0x4cef52';
let provider, signer, userAddress;

console.log("🚀 ArcSum Finance script started!");

async function connectWallet() {
  console.log("🔘 Connect button clicked!");

  if (typeof window.ethereum === "undefined") {
    return alert("Vui lòng cài MetaMask hoặc ví Web3!");
  }

  // Kiểm tra ethers
  if (typeof ethers === "undefined") {
    console.error("❌ ethers is still undefined");
    return alert("ethers.js chưa load. Vui lòng reload trang (Ctrl + Shift + R)");
  }

  console.log("✅ Ethers detected, version:", ethers.version);

  try {
    // Chuyển mạng Arc Testnet
    try {
      await window.ethereum.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: ARC_CHAIN_ID }]
      });
    } catch (error) {
      if (error.code === 4902) {
        await addArcNetwork();
      } else {
        throw error;
      }
    }

    // Kết nối ví
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    console.log("✅ Connected address:", userAddress);

    // Cập nhật nút
    const btn = document.getElementById("connectBtn");
    btn.innerHTML = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
    btn.style.backgroundColor = "#10b981";

    alert(`✅ Kết nối thành công!\n\nĐịa chỉ: ${userAddress}`);

  } catch (error) {
    console.error("❌ Error:", error);
    alert("Lỗi: " + (error.message || error));
  }
}

async function addArcNetwork() {
  try {
    await window.ethereum.request({
      method: 'wallet_addEthereumChain',
      params: [{
        chainId: ARC_CHAIN_ID,
        chainName: 'Arc Testnet',
        nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 },
        rpcUrls: ['https://rpc.testnet.arc.network'],
        blockExplorerUrls: ['https://testnet.arcscan.app']
      }]
    });
    alert("✅ Đã thêm mạng Arc Testnet!");
    return true;
  } catch (e) {
    console.error(e);
    alert("Không thể thêm mạng tự động. Vui lòng thêm thủ công trong MetaMask.");
    return false;
  }
}

window.onload = () => {
  console.log("📄 Page loaded - Ethers ready:", typeof ethers !== "undefined");
};
</script>
</body>
</html>
