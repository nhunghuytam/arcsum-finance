<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance - DEX on Arc</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.min.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <nav class="fixed top-0 w-full bg-black/90 backdrop-blur-md border-b border-zinc-800 z-50">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">ArcSum</h1>
        <span class="text-xs px-3 py-1 bg-emerald-500/10 text-emerald-400 rounded-full">.finance</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="addArcNetwork()" 
                class="px-5 py-2.5 bg-zinc-800 hover:bg-zinc-700 rounded-2xl text-sm transition">
          Add Arc Network
        </button>
        <button onclick="connectWallet()" id="connectBtn"
                class="px-6 py-2.5 bg-emerald-500 hover:bg-emerald-600 rounded-2xl font-semibold transition">
          Connect Wallet
        </button>
      </div>
    </div>
  </nav>

  <div class="max-w-lg mx-auto pt-28 px-4">
    <div class="bg-zinc-900 rounded-3xl p-8 shadow-2xl">
      <h2 class="text-3xl font-bold text-center mb-8">Swap Tokens</h2>
      
      <!-- From -->
      <div class="bg-zinc-800 rounded-2xl p-5 mb-3">
        <div class="flex justify-between text-sm mb-2">
          <span class="text-zinc-400">Bạn trả</span>
          <span class="text-emerald-400">0.00</span>
        </div>
        <div class="flex gap-3">
          <input id="fromAmount" type="text" value="1" 
                 class="bg-transparent text-4xl outline-none flex-1">
          <div class="bg-zinc-700 px-5 py-3 rounded-2xl">USDC</div>
        </div>
      </div>

      <div class="flex justify-center my-2 text-3xl text-zinc-500">↓</div>

      <!-- To -->
      <div class="bg-zinc-800 rounded-2xl p-5">
        <div class="flex justify-between text-sm mb-2">
          <span class="text-zinc-400">Bạn nhận</span>
          <span class="text-emerald-400">0.00</span>
        </div>
        <div class="flex gap-3">
          <input id="toAmount" type="text" value="0.0" readonly
                 class="bg-transparent text-4xl outline-none flex-1">
          <div class="bg-zinc-700 px-5 py-3 rounded-2xl">Chọn token</div>
        </div>
      </div>

      <button onclick="executeSwap()" 
              class="w-full mt-8 bg-gradient-to-r from-cyan-400 to-emerald-500 hover:brightness-110 text-black font-bold py-5 rounded-2xl text-xl transition">
        Swap Now
      </button>
    </div>
  </div>

<script>
let provider, signer, userAddress;
const ROUTER_ADDRESS = "0xADDE8a35A94ea4fC588FCaa34CD802f3afa6DA66";
const CHAIN_ID = "0x4CEF52";

async function addArcNetwork() {
  try {
    await window.ethereum.request({
      method: 'wallet_addEthereumChain',
      params: [{
        chainId: CHAIN_ID,
        chainName: 'Arc Testnet',
        nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 },
        rpcUrls: ['https://rpc.testnet.arc.network']
      }]
    });
    alert("✅ Đã thêm Arc Testnet!");
  } catch (e) {
    console.error(e);
  }
}

async function connectWallet() {
  console.log("Connect button clicked!"); // Debug

  if (typeof window.ethereum === "undefined") {
    return alert("Vui lòng cài MetaMask!");
  }

  try {
    // Switch network
    try {
      await window.ethereum.request({ 
        method: 'wallet_switchEthereumChain', 
        params: [{ chainId: CHAIN_ID }] 
      });
    } catch (switchError) {
      if (switchError.code === 4902) await addArcNetwork();
    }

    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    document.getElementById("connectBtn").innerHTML = 
      `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;

    alert("✅ Kết nối ví thành công!");
  } catch (error) {
    console.error(error);
    alert("Kết nối thất bại: " + error.message);
  }
}

async function executeSwap() {
  if (!userAddress) return alert("Vui lòng Connect Wallet trước!");
  alert("🔄 Chức năng Swap đang được hoàn thiện...");
}

// Debug khi trang load
console.log("✅ ArcSum DEX loaded successfully");
</script>
</body>
</html>
