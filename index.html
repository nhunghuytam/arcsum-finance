<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArcSum Lite</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
</head>
<body class="bg-black text-white min-h-screen">

<div class="max-w-3xl mx-auto p-6">
  <h1 class="text-4xl font-bold mb-4">ArcSum Lite</h1>

  <div class="flex gap-3 mb-6">
    <button onclick="addArcNetwork()" class="bg-slate-700 px-4 py-2 rounded">
      Add Arc Network
    </button>

    <button id="connectBtn" onclick="connectWallet()" class="bg-emerald-600 px-4 py-2 rounded">
      Connect Wallet
    </button>
  </div>

  <div class="bg-zinc-900 p-5 rounded-xl mb-6">
    <div><b>Wallet:</b> <span id="walletAddr">Not Connected</span></div>
    <div><b>USDC Balance:</b> <span id="balance">--</span></div>
  </div>

  <div class="bg-zinc-900 p-5 rounded-xl">
    <h2 class="text-2xl font-bold mb-3">Faucet + Daily Streak</h2>

    <div class="mb-3">
      Current Streak:
      <span id="streakCount" class="font-bold text-emerald-400">0</span>
      day(s)
    </div>

    <div id="streakGrid" class="flex gap-2 mb-4"></div>
<div class="mt-4 mb-4">
  <div>
    Total GM:
    <span id="gmCount" class="font-bold text-green-400">0</span>
  </div>
</div>

<button onclick="sayGM()" class="bg-green-500 text-black px-4 py-2 rounded mb-4">
  Say GM ☀️
</button>

    <button onclick="claimFaucet()" class="bg-cyan-600 px-4 py-2 rounded">
      Open Arc Faucet
    </button>
  </div>
</div>

<script>
const ARC_CHAIN_ID = 5042002;
const ARC_CHAIN_HEX = "0x" + ARC_CHAIN_ID.toString(16);

const ARC_NETWORK_PARAMS = {
  chainId: ARC_CHAIN_HEX,
  chainName: "Arc Testnet",
  nativeCurrency: {
    name: "USDC",
    symbol: "USDC",
    decimals: 18
  },
  rpcUrls: ["https://rpc.testnet.arc.network"],
  blockExplorerUrls: ["https://testnet.arcscan.app"]
};

const USDC_ADDRESS = "0x3600000000000000000000000000000000000000";

const ERC20_ABI = [
 "function balanceOf(address) view returns (uint256)",
 "function decimals() view returns (uint8)"
];

let provider;
let signer;
let address;

function shortAddr(a){
 return a.slice(0,6)+"..."+a.slice(-4);
}

async function addArcNetwork(){
 try{
   await window.ethereum.request({
     method:"wallet_addEthereumChain",
     params:[ARC_NETWORK_PARAMS]
   });
   alert("Arc Testnet added");
 }catch(e){
   alert(e.message);
 }
}

async function connectWallet(){
 try{
   await window.ethereum.request({
     method:"eth_requestAccounts"
   });

   provider = new ethers.providers.Web3Provider(window.ethereum);
   signer = provider.getSigner();
   address = await signer.getAddress();

   document.getElementById("walletAddr").innerText = shortAddr(address);
   document.getElementById("connectBtn").innerText = "Connected";

   loadBalance();

 }catch(e){
   alert(e.message);
 }
}

async function loadBalance(){
 try{
   const usdc = new ethers.Contract(
     USDC_ADDRESS,
     ERC20_ABI,
     provider
   );

   const bal = await usdc.balanceOf(address);
   const dec = await usdc.decimals();

   document.getElementById("balance").innerText =
      Number(
        ethers.utils.formatUnits(bal,dec)
      ).toFixed(2) + " USDC";

 }catch(e){
   document.getElementById("balance").innerText =
      "Unable to load";
 }
}

function getStreak(){
 return JSON.parse(
   localStorage.getItem("arc_streak") ||
   '{"days":0,"last":""}'
 );
}

function saveStreak(s){
 localStorage.setItem(
   "arc_streak",
   JSON.stringify(s)
 );
}

function renderStreak(){
 const grid = document.getElementById("streakGrid");
 const s = getStreak();

 document.getElementById("streakCount").innerText =
   s.days;

 grid.innerHTML = "";

 for(let i=0;i<7;i++){
   const d=document.createElement("div");
   d.className="w-10 h-10 rounded bg-zinc-700 flex items-center justify-center";
   d.innerText = i < s.days ? "✓" : i+1;
   grid.appendChild(d);
 }
}

function bumpStreak(){
 const today = new Date().toDateString();

 let s = getStreak();

 if(s.last !== today){
   s.days += 1;
   s.last = today;
 }

 saveStreak(s);
 renderStreak();
}

function claimFaucet(){

 if(!address){
   alert("Connect wallet first");
   return;
 }

 bumpStreak();

 window.open(
   "https://faucet.circle.com/",
  "_blank"
 );
}
function loadGM(){
 const count =
   localStorage.getItem("arc_gm_count") || 0;

 document.getElementById("gmCount").innerText =
   count;
}

async function sayGM() {

  if (!signer) {
    alert("Connect wallet first");
    return;
  }

  const today = new Date().toDateString();

  const lastGM =
    localStorage.getItem("arc_last_gm");

  if (lastGM === today) {
    alert("You already said GM today ✅");
    return;
  }

  try {

    const signature = await signer.signMessage(
      `GM Arc ${today}`
    );

    let count = parseInt(
      localStorage.getItem("arc_gm_count") || "0"
    );

    count++;

    localStorage.setItem(
      "arc_gm_count",
      count
    );

    localStorage.setItem(
      "arc_last_gm",
      today
    );

    localStorage.setItem(
      "arc_last_signature",
      signature
    );

    document.getElementById("gmCount").innerText =
      count;

    bumpStreak();

    alert("GM signed successfully ✅");

  } catch (err) {

    alert("Signature cancelled");

  }
}
renderStreak();
loadGM();
</script>
</body>
</html>
