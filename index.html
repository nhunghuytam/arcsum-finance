<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance - DEX on Arc</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Ethers.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.5/ethers.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <script>
    // Khởi tạo Tailwind
    tailwind.config = {
      content: [],
      theme: { extend: {} }
    }
  </script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <!-- Navbar -->
  <nav class="fixed top-0 w-full bg-zinc-900/95 backdrop-blur-md border-b border-zinc-700 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <h1 class="text-3xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">ArcSum</h1>
        <span class="text-xs px-2 py-1 bg-emerald-500/10 text-emerald-400 rounded-full">.finance</span>
      </div>
      <div class="flex items-center gap-4">
        <button onclick="addArcNetwork()" 
                class="bg-zinc-800 hover:bg-zinc-700 px-5 py-2.5 rounded-2xl text-sm transition">
          Add Arc Network
        </button>
        <button onclick="connectWallet()" id="connectBtn" 
                class="bg-emerald-500 hover:bg-emerald-600 px-6 py-2.5 rounded-2xl font-semibold transition">
          Connect Wallet
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <div class="max-w-7xl mx-auto px-6 pt-28 pb-20 text-center">
    <h2 class="text-5xl font-bold mb-4">ArcSum Finance</h2>
    <p class="text-xl text-zinc-400">Liquidity Hub trên Arc L1</p>
  </div>

  <!-- Connect Button -->
  <div class="max-w-md mx-auto bg-zinc-900 rounded-3xl p-8 mt-10">
    <button onclick="connectWallet()" 
            class="w-full bg-emerald-500 hover:bg-emerald-600 text-black font-bold py-4 rounded-2xl text-lg transition">
      Connect Wallet
    </button>
  </div>

<script>
// === CẤU HÌNH ARC TESTNET ===
const ARC_CHAIN_ID = '0x4CEF52';

let provider, signer, userAddress;

// Đợi ethers.js load xong
async function waitForEthers() {
  if (typeof ethers !== "undefined") return true;
  
  return new Promise((resolve, reject) => {
    let attempts = 0;
    const interval = setInterval(() => {
      attempts++;
      if (typeof ethers !== "undefined") {
        clearInterval(interval);
        resolve(true);
      }
      if (attempts > 50) { // timeout ~5 giây
        clearInterval(interval);
        reject(new Error("ethers.js chưa tải được"));
      }
    }, 100);
  });
}

// Thêm mạng Arc
async function addArcNetwork() {
  try {
    await window.ethereum.request({
      method: 'wallet_addEthereumChain',
      params: [{
        chainId: ARC_CHAIN_ID,
        chainName: 'Arc Testnet',
        nativeCurrency: { 
          name: 'ETH', 
          symbol: 'ETH', 
          decimals: 18 
        },
        rpcUrls: ['https://rpc.testnet.arc.network'],
        blockExplorerUrls: ['https://testnet.arcscan.app']
      }]
    });
    alert("✅ Đã thêm mạng Arc Testnet thành công!");
    return true;
  } catch (e) {
    console.error(e);
    alert("Không thể thêm mạng tự động.\nVui lòng thêm thủ công trong MetaMask.");
    return false;
  }
}

// Chuyển sang mạng Arc
async function switchToArcNetwork() {
  try {
    await window.ethereum.request({
      method: 'wallet_switchEthereumChain',
      params: [{ chainId: ARC_CHAIN_ID }],
    });
    return true;
  } catch (error) {
    if (error.code === 4902) { // Chain chưa được thêm
      return await addArcNetwork();
    }
    console.error(error);
    alert("Không thể chuyển mạng: " + error.message);
    return false;
  }
}

// Kết nối ví
async function connectWallet() {
  if (!window.ethereum) {
    return alert("Vui lòng cài đặt MetaMask hoặc ví Web3!");
  }

  try {
    await waitForEthers();

    const switched = await switchToArcNetwork();
    if (!switched) return;

    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    // Cập nhật nút Connect
    const connectBtn = document.getElementById("connectBtn");
    connectBtn.innerHTML = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
    connectBtn.style.backgroundColor = "#10b981"; // emerald-500

    alert(`✅ Kết nối thành công!\n\nĐịa chỉ: ${userAddress}`);
    
  } catch (error) {
    console.error(error);
    alert("Kết nối thất bại: " + (error.message || error));
  }
}

// Khởi tạo khi trang load
window.onload = () => {
  console.log("%c🚀 ArcSum Finance loaded successfully!", "color: #10b981; font-size: 14px");
  if (typeof ethers === "undefined") {
    console.warn("⚠️ ethers.js chưa load");
  }
};
</script>
</body>
</html>
