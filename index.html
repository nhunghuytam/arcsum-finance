<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcSum Finance</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <nav class="fixed top-0 w-full bg-zinc-900 p-6">
    <div class="max-w-7xl mx-auto flex justify-between">
      <h1 class="text-3xl font-bold text-emerald-400">ArcSum Finance</h1>
      <button onclick="connectWallet()" id="connectBtn"
              class="bg-emerald-500 hover:bg-emerald-600 px-8 py-3 rounded-2xl font-bold">
        Connect Wallet
      </button>
    </div>
  </nav>

  <div class="pt-32 text-center">
    <h2 class="text-5xl font-bold mb-4">ArcSum Finance</h2>
    <p class="text-xl text-zinc-400">Test Connect Wallet</p>
  </div>

<script>
async function connectWallet() {
  console.log("🔘 Button clicked!");

  if (!window.ethereum) {
    return alert("❌ Vui lòng cài MetaMask!");
  }

  try {
    // Chuyển mạng Arc
    try {
      await window.ethereum.request({
        method: 'wallet_switchEthereumChain',
        params: [{ chainId: '0x4cef52' }]
      });
    } catch (e) {
      if (e.code === 4902) {
        await addArcNetwork();
      } else {
        throw e;
      }
    }

    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    const address = accounts[0];

    document.getElementById("connectBtn").innerHTML = address.slice(0,6) + "..." + address.slice(-4);
    document.getElementById("connectBtn").style.backgroundColor = "#10b981";

    alert("✅ Kết nối thành công!\n" + address);
    
  } catch (error) {
    console.error(error);
    alert("Lỗi: " + (error.message || error));
  }
}

async function addArcNetwork() {
  await window.ethereum.request({
    method: 'wallet_addEthereumChain',
    params: [{
      chainId: '0x4cef52',
      chainName: 'Arc Testnet',
      nativeCurrency: { name: 'USDC', symbol: 'USDC', decimals: 18 },
      rpcUrls: ['https://rpc.testnet.arc.network']
    }]
  });
}

// Debug
console.log("🚀 Script loaded - Ready");
</script>
</body>
</html>
