<script>
let provider, signer, userAddress;

const ARC_CHAIN_ID = '0x4CEF52'; // 5042002

async function switchToArcNetwork() {
  if (typeof window.ethereum === "undefined") return false;

  try {
    // Thử switch trước
    await window.ethereum.request({
      method: 'wallet_switchEthereumChain',
      params: [{ chainId: ARC_CHAIN_ID }],
    });
    return true;
  } catch (switchError) {
    // Nếu chưa có mạng → thêm mạng
    if (switchError.code === 4902) {
      try {
        await window.ethereum.request({
          method: 'wallet_addEthereumChain',
          params: [{
            chainId: ARC_CHAIN_ID,
            chainName: 'Arc Testnet',
            nativeCurrency: { 
              name: 'USDC', 
              symbol: 'USDC', 
              decimals: 18 
            },
            rpcUrls: ['https://rpc.testnet.arc.network'],
            blockExplorerUrls: ['https://testnet.arcscan.app']
          }]
        });
        return true;
      } catch (addError) {
        console.error(addError);
        alert("Không thể thêm mạng Arc. Vui lòng thử thủ công.");
        return false;
      }
    }
    console.error(switchError);
    return false;
  }
}

async function connectWallet() {
  if (typeof window.ethereum === "undefined") {
    return alert("Vui lòng cài MetaMask!");
  }

  try {
    // Bước 1: Switch sang Arc Testnet
    const switched = await switchToArcNetwork();
    if (!switched) {
      return alert("Vui lòng switch sang Arc Testnet thủ công.");
    }

    // Bước 2: Kết nối ví
    provider = new ethers.BrowserProvider(window.ethereum);
    await provider.send("eth_requestAccounts", []);
    signer = await provider.getSigner();
    userAddress = await signer.getAddress();

    // Cập nhật nút
    const btn = document.getElementById("connectBtn");
    if (btn) {
      btn.innerHTML = `${userAddress.slice(0,6)}...${userAddress.slice(-4)}`;
      btn.onclick = null; // disable click sau khi connect
    }

    alert(`✅ Kết nối thành công!\nĐịa chỉ: ${userAddress}\nMạng: Arc Testnet`);
    
  } catch (error) {
    console.error(error);
    alert("Kết nối thất bại: " + (error.message || error));
  }
}

// Giữ hàm addArcNetwork cũ để người dùng bấm thủ công nếu cần
async function addArcNetwork() {
  await switchToArcNetwork();
}
</script>
